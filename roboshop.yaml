- name: roboshop instances management
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "mysql"]
    image_id: ami-0220d79f3f480ecf5
    work: delete
  tasks:
     - name: create ec2 Instances
       amazon.aws.ec2_instance:
          name: "roboshop-{{ item }}"
          image_id: "{{ image_id }}"
          instance_type: t3.micro
          region: us-east-1
          security_groups: 
            - roboshop-common
            - "roboshop-{{ item }}"
       loop: "{{ instances }}"
       register: ec2_output
       when: work == "create"

     - name: print ec2_output
       debug:
          msg: "{{ ec2_output }}"


     - name: delete ec2_instances
       amazon.aws.ec2_instance:
        state: 'absent'
        name: "roboshop-{{ item }}"
        wait: false
        region: us-east-1
       loop: "{{ instances }}"
       when: work == "delete"
