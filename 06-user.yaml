- name: configuring user service
  hosts: user
  become: yes
  tasks:
    - name: enable nodejs 20
      command: dnf module enable nodejs:20 -y

    - name: install nodejs
      package:
        name: nodejs
        state: present

    - name: create system user
      user:
        name: roboshop
        shell: /sbin/nologin
        system: true
        home: /app
        comment: "Roboshop System User"

    - name: remove a directory /app
      file:
        path: /app
        state: absent

    - name: remove user zip file in tmp directory
      file:
        path: /tmp/user.zip
        state: absent
    
    - name: create app directory
      file:
        path: /app
        state: directory 

    - name: download user.zip
      get_url:
        url: "https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip"
        dest: /tmp/user.zip

    - name: unzip user.zip
      unarchive:
      src: /tmp/user.zip
      dest: /app
      remote_src: yes

    - name: install dependencies
      community.general.npm:
        path: /app

    - name: copy user.service file
      template:
        src: user.service.j2
        dest: /etc/systemd/system/user.service
        
    - name: daemon_relaod
      systemd_service:
        name: user
        daemon_reload: true

    - name: enable and start user
      service: 
        name: user
        state: restarted
        enabled: yes
    